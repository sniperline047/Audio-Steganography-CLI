name: Tests on macOS

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python 3.15 on macos-latest${{ !matrix.extras && ' without extras' || '' }}
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        extras: [true, false]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - run: python -m pip install -r requirements_dev.txt "${{ matrix.extras && '.[crypto,signal]' || '.' }}"
      - name: Check that the installed package is tested
        run: python -c "import audiosteg; assert 'site-packages' in audiosteg.__file__, audiosteg.__file__"
      - name: Check that the extras are missing
        if: ${{ !matrix.extras }}
        run: python -c "from importlib.util import find_spec; assert not any(map(find_spec, ('cryptography', 'numpy')))"
      - name: Test without the extras
        if: ${{ !matrix.extras }}
        run: python -m pytest
      - name: Test with the extras
        if: ${{ matrix.extras }}
        env:
          AUDIOSTEG_REQUIRE_CRYPTO: "1"
          AUDIOSTEG_REQUIRE_SIGNAL: "1"
        run: python -m pytest --cov --cov-report=term-missing
