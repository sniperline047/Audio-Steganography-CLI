name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}${{ !matrix.crypto && ' without crypto' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        crypto: [true, false]
        include:
          - {os: windows-latest, python: "3.15", crypto: true}
          - {os: windows-latest, python: "3.15", crypto: false}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements_dev.txt "${{ matrix.crypto && '.[crypto]' || '.' }}"
      - name: Check that the installed package is tested
        run: python -c "import audiosteg; assert 'site-packages' in audiosteg.__file__, audiosteg.__file__"
      - name: Check that the crypto extra is missing
        if: ${{ !matrix.crypto }}
        run: python -c "import importlib.util; assert importlib.util.find_spec('cryptography') is None"
      - name: Test without the crypto extra
        if: ${{ !matrix.crypto }}
        run: python -m pytest
      - name: Test with the crypto extra
        if: ${{ matrix.crypto }}
        env:
          AUDIOSTEG_REQUIRE_CRYPTO: "1"
        run: python -m pytest --cov --cov-report=term-missing --cov-report=json
      - name: Add coverage to the job summary
        if: ${{ !cancelled() && matrix.crypto && matrix.os == 'ubuntu-latest' && matrix.python == '3.15' && hashFiles('.coverage') != '' }}
        run: |
          echo "## Test coverage" >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=markdown --fail-under=0 >> "$GITHUB_STEP_SUMMARY"
      - name: Save coverage
        if: ${{ !cancelled() && matrix.crypto && matrix.os == 'ubuntu-latest' && matrix.python == '3.15' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage_report
          path: coverage.json
          if-no-files-found: ignore
          retention-days: 5

  checks:
    name: Lint, types, and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - run: python -m pip install -r requirements_dev.txt ".[crypto]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: Audit the development tools, the dependencies, and the crypto extra
        run: |
          set -euo pipefail
          python - > "$RUNNER_TEMP/runtime.txt" <<'EOF'
          import tomllib
          project = tomllib.load(open("pyproject.toml", "rb"))["project"]
          print(*project["dependencies"], *project["optional-dependencies"]["crypto"], sep="\n")
          EOF
          for name in rich questionary cryptography; do grep -q "^$name" "$RUNNER_TEMP/runtime.txt"; done
          pip-audit -r requirements_dev.txt -r "$RUNNER_TEMP/runtime.txt"
      - name: Check that the sample audio is reproducible
        run: |
          python scripts/generate_sample_audio.py
          git diff --exit-code -- src/audiosteg/data/sample.wav

  build:
    name: Build and install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - run: python -m pip install -r requirements_dev.txt
      - run: python -m build --outdir "$RUNNER_TEMP/dist"
      - name: Check the files in the wheel
        run: |
          set -euo pipefail
          unzip -Z1 "$RUNNER_TEMP"/dist/*.whl | tee "$RUNNER_TEMP/wheel_files.txt"
          data=$(grep '^audiosteg/data/.' "$RUNNER_TEMP/wheel_files.txt")
          test "$data" = audiosteg/data/sample.wav
          if grep -vE '^audiosteg/([a-z_]+/)*[a-z_]+\.py$|^audiosteg/py\.typed$|^audiosteg/data/sample\.wav$|^audiosteg-[^/]+\.dist-info/' "$RUNNER_TEMP/wheel_files.txt"; then
            echo "The wheel contains unexpected files."
            exit 1
          fi
          grep -qxF audiosteg/py.typed "$RUNNER_TEMP/wheel_files.txt"
          grep -qx 'audiosteg-[^/]*\.dist-info/licenses/LICENSE' "$RUNNER_TEMP/wheel_files.txt"
      - name: Install the wheel in clean environments
        run: |
          set -euo pipefail
          wheel=$(ls "$RUNNER_TEMP"/dist/*.whl)
          python -m venv "$RUNNER_TEMP/clean"
          python -m venv "$RUNNER_TEMP/clean_crypto"
          "$RUNNER_TEMP/clean/bin/python" -m pip install "$wheel"
          "$RUNNER_TEMP/clean_crypto/bin/python" -m pip install "${wheel}[crypto]"
          "$RUNNER_TEMP/clean/bin/python" -m pip check
          "$RUNNER_TEMP/clean_crypto/bin/python" -m pip check
          "$RUNNER_TEMP/clean/bin/python" -c "import importlib.util; assert importlib.util.find_spec('cryptography') is None"
          "$RUNNER_TEMP/clean_crypto/bin/python" -c "import cryptography"
      - name: Hide and read a message from an empty folder
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/empty"
          cd "$RUNNER_TEMP/empty"
          printf 'key\n' > key.txt
          chmod 600 key.txt
          plain="$RUNNER_TEMP/clean/bin"
          crypto="$RUNNER_TEMP/clean_crypto/bin"
          "$plain/audiosteg" --version
          "$plain/audiosteg" algorithms --json | python -m json.tool
          for algorithm in lsb lsb_2 lsb_4 lsb_parity lsb_matching; do
            printf '%s' "Hello $algorithm" | "$plain/audiosteg" hide sample -a "$algorithm"
            test "$("$plain/python" -m audiosteg reveal sample.stego.wav)" = "Hello $algorithm"
            "$plain/audiosteg" verify sample.stego.wav -m "Hello $algorithm"
            "$crypto/audiosteg" hide sample -m "Secret $algorithm" -a "$algorithm" --passphrase_file key.txt --force
            test "$("$crypto/python" -m audiosteg reveal sample.stego.wav --passphrase_file key.txt)" = "Secret $algorithm"
            if "$plain/audiosteg" reveal sample.stego.wav --passphrase_file key.txt; then exit 1; fi
            rm sample.stego.wav
          done
          if "$plain/audiosteg" hide sample -m Hello --passphrase_file key.txt; then exit 1; fi
          printf 'wrong\n' > wrong.txt
          chmod 600 wrong.txt
          "$crypto/audiosteg" hide sample -m "Secret lsb_keyed" -a lsb_keyed --passphrase_file key.txt
          test "$("$crypto/audiosteg" reveal sample.stego.wav --passphrase_file key.txt)" = "Secret lsb_keyed"
          "$crypto/audiosteg" verify sample.stego.wav -m "Secret lsb_keyed" -a lsb_keyed --passphrase_file key.txt
          "$crypto/audiosteg" inspect sample.stego.wav --json > "$RUNNER_TEMP/inspect_keyed.json"
          jq -e '.messages == []' "$RUNNER_TEMP/inspect_keyed.json"
          if "$crypto/audiosteg" reveal sample.stego.wav --passphrase_file wrong.txt; then exit 1; fi
          rm sample.stego.wav wrong.txt
          "$plain/audiosteg" hide sample -m Hello
          "$plain/audiosteg" inspect sample.stego.wav --json > "$RUNNER_TEMP/inspect.json"
          jq -e '.messages == [{"algorithm": "lsb", "encrypted": false, "size": 5, "problem": null}]' "$RUNNER_TEMP/inspect.json"
          "$plain/audiosteg" compare sample sample.stego.wav --json > "$RUNNER_TEMP/compare.json"
          jq -e '.quality == "Excellent" and .largest_change == 1' "$RUNNER_TEMP/compare.json"
          "$plain/audiosteg" explain lsb | grep -F "Reading the same bits gives 'h' again."
          rm sample.stego.wav
          test "$(ls)" = key.txt

  badge:
    name: Update coverage badge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [tests, checks, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage_report
          path: ${{ runner.temp }}/coverage_report
      - name: Publish badge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REPORT: ${{ runner.temp }}/coverage_report/coverage.json
        run: |
          set -euo pipefail
          percent=$(jq -er '.totals.percent_covered_display' "$REPORT")
          if ! [[ "$percent" =~ ^([0-9]|[1-9][0-9]|100)$ ]]; then
            echo "The coverage value is not a whole number from 0 to 100."
            exit 1
          fi
          svg=$(printf '%s' \
            '<svg xmlns="http://www.w3.org/2000/svg" width="110" height="20" role="img" aria-label="coverage: '"$percent"'%">' \
            '<rect width="66" height="20" fill="#555"/><rect x="66" width="44" height="20" fill="#2e7d32"/>' \
            '<g fill="#fff" text-anchor="middle" font-family="Verdana,sans-serif" font-size="11">' \
            '<text x="33" y="14">coverage</text><text x="88" y="14">'"$percent"'%</text></g></svg>')
          tree=$(jq -n --arg svg "$svg" \
            '{tree: [{path: "coverage.svg", mode: "100644", type: "blob", content: $svg}]}' |
            gh api "repos/$REPO/git/trees" --input - --jq .sha)
          parent=$(gh api "repos/$REPO/git/matching-refs/heads/coverage_badge" |
            jq -r '[.[] | select(.ref == "refs/heads/coverage_badge") | .object.sha][0] // empty')
          commit=$(jq -n --arg tree "$tree" --arg parent "$parent" \
            '{message: "Update coverage badge", tree: $tree, parents: (if $parent == "" then [] else [$parent] end)}' |
            gh api "repos/$REPO/git/commits" --input - --jq .sha)
          if [ -n "$parent" ]; then
            gh api --silent -X PATCH "repos/$REPO/git/refs/heads/coverage_badge" -f "sha=$commit"
          else
            gh api --silent "repos/$REPO/git/refs" -f ref=refs/heads/coverage_badge -f "sha=$commit"
          fi
