[build-system]
requires = ["flit_core==4.2.0"]
build-backend = "flit_core.buildapi"

[project]
name = "audiosteg"
version = "0.1.0"
description = "A learning project for hiding messages in WAV files."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "questionary>=2.1.1",
    "rich>=15.0.0",
]

[project.optional-dependencies]
crypto = ["cryptography>=50.0.0"]

[project.scripts]
audiosteg = "audiosteg.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["needs_crypto: needs the optional encryption library"]

[tool.coverage.run]
branch = true
source = ["scripts"]
source_pkgs = ["audiosteg"]
patch = ["subprocess"]

[tool.coverage.paths]
audiosteg = ["src/audiosteg", "*/site-packages/audiosteg"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "scripts"]
mypy_path = "src"
